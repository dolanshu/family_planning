# 生产 HTTPS 部署叠加层（Caddy 自动申请 Let's Encrypt 证书）
#
# 用法：
#   export DOMAIN=todo.example.com
#   export SESSION_SECRET=<一段随机字符串>
#   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d
#
# 注意：需要把域名 A 记录指向本机 IP。本配置使用 8070 作为 HTTPS 端口（当 443 被占用时），
#       80 端口用于证书校验（HTTP-01）与 HTTP→HTTPS 跳转，需保持可访问。
#       访问地址形如 https://todo.example.com:8070
services:
  app:
    environment:
      TRUST_PROXY: "1"
      SESSION_SECRET: ${SESSION_SECRET:?请设置 SESSION_SECRET 环境变量}
      NODE_ENV: production
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DOMAIN: ${DOMAIN:?请设置 DOMAIN 环境变量}
    # 生产环境不把 app 直接暴露到宿主机：仅由同网络内的 Caddy 反代（app:3000）
    ports: !override []

  caddy:
    image: caddy:2-alpine
    container_name: family-todo-caddy
    profiles: ["https"]
    ports:
      - "80:80"
      - "8070:8070"
    environment:
      DOMAIN: ${DOMAIN:?请设置 DOMAIN 环境变量}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
