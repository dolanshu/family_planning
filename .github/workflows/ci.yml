name: CI

# 每次 push / PR 到 main 都跑：单元测试 → 镜像构建冒烟 → E2E。
# 只改文档时跳过，避免浪费额度。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: 单元测试 / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试（node --test）
        run: npm test

  docker:
    name: 镜像构建 + 启动冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: family-planning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并校验健康状态
        run: |
          set -euo pipefail
          docker run -d --name fp-smoke -p 3000:3000 \
            -e SESSION_SECRET=ci-smoke-secret \
            -e ALLOW_REGISTRATION=true \
            family-planning:ci

          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          if [ "$code" != "401" ]; then
            echo "::error::容器健康检查失败，/api/auth/me 返回 $code"
            docker logs fp-smoke
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/ -o /dev/null
          echo "冒烟通过：首页可访问、接口返回 401（未登录）"

      - name: 输出容器日志
        if: always()
        run: docker logs fp-smoke || true

  e2e:
    name: E2E 测试 / Playwright Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E（自动拉起服务）
        env:
          SESSION_SECRET: ci-e2e-secret
          ALLOW_REGISTRATION: 'true'
          DATA_FILE: /tmp/fp-e2e-data/todo.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/fp-e2e-data
          npm start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          # global-setup 会轮询 BASE_URL 直到就绪（最多 30s）
          # 排除 @docker 部署回归用例：它要求环境里有正在运行的容器，
          # 预合并 CI 只是 npm start 起普通服务，应由真实部署后单独跑。
          npm run test:e2e -- --grep-invert '@docker'

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
